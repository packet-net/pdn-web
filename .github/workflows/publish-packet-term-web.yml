name: publish

# Pushes packet-term-web/index.html to OARC object storage (folder 4852 - the
# packet-term.m0lte.uk static-site folder) on every push to main.
# The app is a single static file, so the "build" is a no-op and the only
# artefact is index.html itself.
#
# This repo holds one folder per UI and they are published in different ways:
# this one goes to OARC object storage and is served from packet-term.m0lte.uk,
# while soundmodem-web goes to this repo's GitHub Pages site. Each app keeps the
# pipeline it already had; nothing here is shared between them on purpose.

on:
  push:
    branches: [main]
    paths:
      - 'packet-term-web/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    # Manual force-publish - useful if you've redeployed by hand and
    # want CI to re-establish the canonical state.

concurrency:
  # Don't overlap publishes - last writer wins is fine since we always
  # upload index.html with --overwrite, but avoid the racy interleave.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: upload index.html to OARC object storage
    runs-on: [self-hosted, Linux, X64]
    env:
      OARC_TOKEN: ${{ secrets.OARC_TOKEN }}
      # folder 4852 = packet-term.m0lte.uk static-site folder.
      OARC_FOLDER_ID: '4852'
    steps:
      - uses: actions/checkout@v6

      - name: fetch OARC object storage CLI
        # Pulled fresh on every run - the CLI is small and OARC is the
        # canonical home for it. No vendoring + no version-pin: we always
        # publish via the latest CLI the service ships. Installed into a
        # venv to sidestep PEP 668 on system Python.
        run: |
          curl -fSL -o "${RUNNER_TEMP}/object-storage-cli.zip" \
            https://compute.oarc.uk/static/downloads/object-storage-cli.zip
          # python -m zipfile avoids needing `unzip` on the runner image
          python3 -m zipfile -e "${RUNNER_TEMP}/object-storage-cli.zip" "${RUNNER_TEMP}"
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet -r \
            "${RUNNER_TEMP}/object-storage-cli/requirements.txt"

      - name: upload index.html
        if: env.OARC_TOKEN != ''
        run: |
          "${RUNNER_TEMP}/venv/bin/python" \
            "${RUNNER_TEMP}/object-storage-cli/object_storage_cli.py" \
            --token "${OARC_TOKEN}" \
            --upload packet-term-web/index.html \
            --folder "${OARC_FOLDER_ID}" \
            --overwrite \
            --json

      - name: fail if OARC_TOKEN missing
        if: env.OARC_TOKEN == ''
        run: |
          echo "::error::OARC_TOKEN secret is not set on this repo - upload was skipped. Add it on the repo's settings page."
          exit 1
